<!--
  Legacy launcher icon (Android 5.0-7.1), background baked in.

  Same mark as branding/acua-logo.svg with the "CAFÉ · RESTAURANT · LOUNGE"
  tagline dropped — at 48-72px it is an illegible smear and it forces the
  wordmark down to an unrecognisable size.

  The glyphs span x 53.5..482.5, so their centre is x=268, NOT 256. Centring
  on 256 is what clipped the outer A's on the first attempt.

  Android 8+ uses the adaptive icon in mipmap-anydpi-v26 instead of this.
  See branding/acua-launcher-foreground.svg and README for regeneration.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#e8eef4"/>
  <g transform="translate(256 256) scale(0.95) translate(-268 -256)">
    <g fill="none" stroke="#22b3c6" stroke-width="21" stroke-linecap="butt" stroke-linejoin="miter">
      <path d="M64 336 L104 176 L144 336 M78 282 L130 282"/>
      <path d="M250 200 A68 78 0 1 0 250 312" stroke-linecap="round"/>
      <path d="M282 176 L282 292 A43 43 0 0 0 368 292 L368 176" stroke-linecap="round"/>
      <path d="M392 336 L432 176 L472 336 M406 282 L458 282"/>
    </g>
  </g>
</svg>
