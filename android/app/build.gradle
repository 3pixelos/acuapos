plugins {
    id 'com.android.application'
}

// Release signing. The keystore is NEVER committed (see android/.gitignore):
// its location and passwords come from android/keystore.properties locally,
// or from environment variables in CI. With neither present the release build
// simply comes out unsigned — that still compiles, it just can't be installed,
// which is the honest outcome rather than a silent debug-signed "release".
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def storeFilePath = keystoreProps['storeFile'] ?: System.getenv('ACUA_KEYSTORE_FILE')
def storePw = keystoreProps['storePassword'] ?: System.getenv('ACUA_KEYSTORE_PASSWORD')
def keyAliasName = keystoreProps['keyAlias'] ?: System.getenv('ACUA_KEY_ALIAS')
def keyPw = keystoreProps['keyPassword'] ?: System.getenv('ACUA_KEY_PASSWORD')
def canSign = storeFilePath && rootProject.file(storeFilePath).exists()

android {
    namespace 'com.acua.pos'
    compileSdk 34

    defaultConfig {
        applicationId "com.acua.pos"
        // API 21 (Android 5.0) so the old staff phones can install it —
        // the WebView comes from the system and updates via Play, so even
        // ancient devices render the app fine regardless of Chrome version.
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    if (canSign) {
        signingConfigs {
            release {
                storeFile rootProject.file(storeFilePath)
                storePassword storePw
                keyAlias keyAliasName
                keyPassword keyPw
            }
        }
    }

    buildTypes {
        release {
            // No shrinking: the app is a single Activity, nothing to gain.
            minifyEnabled false
            if (canSign) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Zero dependencies on purpose: plain android.app.Activity + WebView.
// No AndroidX, no Kotlin — smallest possible APK, fastest build.
