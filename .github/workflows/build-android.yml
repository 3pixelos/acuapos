name: Build Android APK

# Produces the installable APK for the waiters' phones. The app is a thin
# WebView around https://acuapos.vercel.app, so this only has to be re-run
# when the SHELL changes (icon, name, URL) — pushing a new web build to
# Vercel reaches every phone on the next app open, no reinstall.
#
# MANUAL ONLY, on purpose. It used to also fire on an android-v* tag, but
# publishing a Release creates that tag — so cutting a release of an APK built
# elsewhere tripped this workflow, which then failed on the missing signing
# secrets and left a red X against a perfectly good commit. Signing material
# lives on the developer's machine, not in the repo, so this can only succeed
# once the ANDROID_KEYSTORE_* secrets are set; until then it should run only
# when somebody deliberately asks for it.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Signing material comes from repository secrets. Without them the
      # release APK comes out unsigned and cannot be installed, so the build
      # fails loudly at the verify step below rather than shipping a dud.
      #   ANDROID_KEYSTORE_BASE64  — base64 of android/acua-release.keystore
      #   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set — cannot produce an installable APK."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/acua-release.keystore

      - name: Build release APK
        working-directory: android
        env:
          ACUA_KEYSTORE_FILE: acua-release.keystore
          ACUA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ACUA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ACUA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify it is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: acua-pos-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # No release step: this workflow is manual-only now, so there is never a
      # tag to attach to. Download the APK from the run's Artifacts, or upload
      # it to a Release by hand.
