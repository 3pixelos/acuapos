name: Build Windows app

# Produces the downloadable Windows installer (.exe / NSIS setup) for the
# Caisse app. Runs on a version tag (v1.2.3 -> attaches to a GitHub Release)
# and can also be triggered by hand from the Actions tab for a plain build.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Needed for the release step: the default GITHUB_TOKEN is read-only and
# 403s on release creation without this.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      # The frontend needs its Supabase URL + anon key at build time. Set
      # these as repository secrets (Settings -> Secrets -> Actions) so the
      # baked-in .exe talks to the right project.
      - name: Write .env
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: acua-pos-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
